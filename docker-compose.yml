version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mailserver-postgres
    environment:
      POSTGRES_DB: mailserver
      POSTGRES_USER: mailserver
      POSTGRES_PASSWORD: mailserver_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailserver"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mailserver-net

  valkey:
    image: valkey/valkey:9.1
    container_name: mailserver-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mailserver-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: mailserver-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - mailserver-net

  stalwart:
    image: stalwartlabs/stalwart:v0.16.14
    container_name: mailserver-stalwart
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "8080:8080"
      - "443:443"
    volumes:
      - stalwart_data:/opt/stalwart-mail/data
      - ./infrastructure/stalwart/config.toml:/opt/stalwart-mail/etc/config.toml
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - mailserver-net

  rspamd:
    image: rspamd/rspamd:4.1
    container_name: mailserver-rspamd
    ports:
      - "11334:11334"
    volumes:
      - ./infrastructure/rspamd/local.d:/etc/rspamd/local.d
      - rspamd_data:/var/lib/rspamd
    networks:
      - mailserver-net

  clamav:
    image: clamav/clamav:1.4
    container_name: mailserver-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - mailserver-net

networks:
  mailserver-net:
    driver: bridge

volumes:
  pg_data:
  valkey_data:
  stalwart_data:
  minio_data:
  rspamd_data:
  clamav_data:
