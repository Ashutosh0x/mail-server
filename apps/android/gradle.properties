org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The API base URL for debug builds. Overridable per developer without editing
# a tracked file: put MAILSERVER_BASE_URL in ~/.gradle/gradle.properties or pass
# -PMAILSERVER_BASE_URL=... . 10.0.2.2 is the emulator's route to the host
# machine's localhost; a physical device needs the host's LAN address instead.
MAILSERVER_BASE_URL_DEBUG=http://10.0.2.2:3000/

# Production must be HTTPS: the session cookie is issued with `secure` set when
# NODE_ENV=production, so a plain-HTTP production build cannot authenticate at
# all. There is deliberately no default here.
MAILSERVER_BASE_URL_RELEASE=
